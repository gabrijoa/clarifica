[project]
name = "clarifica"
version = "0.1.0"
description = "tool for formatting stantards our documents"
authors = [
    {name = "gabrijoa",email = "joagabridev@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "pymupdf (>=1.26.3,<2.0.0)",
    "pypandoc (>=1.15,<2.0)",
    "reportlab (>=4.4.3,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"

[tool.pytest.ini_options]
pythonpath = [
  "."
]